<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover so the app can use the safe-area insets on notched phones -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>SplitLocal</title>

    <!-- PWA: Expo no longer generates a manifest, so it is linked by hand. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1CC29F" />
    <meta
      name="description"
      content="Split shared expenses with friends. No account, no server — everything stays on your device."
    />

    <link rel="icon" href="/favicon.ico" />
    <!-- iOS ignores the manifest; it needs these to install to the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SplitLocal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      The `react-native-web` recommended style reset:
      https://necolas.github.io/react-native-web/docs/setup/#root-element
    -->
    <style id="expo-reset">
      /*
        Fill the window exactly — including the area behind the iOS home
        indicator — without leaving a strip of <body> visible underneath.

        Anchoring all four edges of a fixed <body> is what actually pins it: a
        fixed element with only a height is not anchored to the viewport, so on
        iOS it can come up short and let the page background show through below
        the tab bar. inset:0 makes the window the sole source of truth, so no
        height unit (100%, 100vh, 100dvh) is consulted at all.
      */
      html {
        height: 100%;
      }
      body {
        position: fixed;
        inset: 0; /* top/right/bottom/left: 0 */
        margin: 0;
        overflow: hidden;
        /* stop rubber-band scrolling revealing the page behind the app */
        overscroll-behavior: none;
        background-color: #f5f7fa;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Register the offline service worker (generated at build time).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* offline support is a bonus; ignore failures */
          });
        });
      }
    </script>
  </body>
</html>
